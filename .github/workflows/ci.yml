name: build-font

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: jinjer-sans-upstream-${{ hashFiles('sources.lock.json') }}
      - run: sudo apt-get update && sudo apt-get install -y libharfbuzz-bin opentype-sanitizer
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip_audit -r requirements-dev.lock --strict
      - run: python -m pytest
      - run: python -m jinjer_sans.build all --jobs 4
      - run: python -m jinjer_sans.qa --external
      # FontBakery currently requires freetype-py<2.4 while the pinned Gen
      # Interface JP builder requires >=2.4, so keep the validator isolated.
      - run: |
          python -m venv .fontbakery-venv
          .fontbakery-venv/bin/pip install --require-hashes -r requirements-fontbakery.lock
          .fontbakery-venv/bin/fontbakery check-universal --configuration fontbakery.toml --succinct dist/desktop/jinjerSans-VF.ttf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jinjer-sans-${{ github.sha }}
          path: dist/release/
          retention-days: 14
