[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jinjer-sans"
version = "1.0.0"
description = "Reproducible build pipeline for the jinjer sans brand font"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "brotli==1.2.0",
  "fonttools[woff]==4.66.1",
  "freetype-py==2.5.1",
  "ofl-font-baker==0.4.8",
]

[project.optional-dependencies]
dev = [
  "munkres==1.1.4",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
]

[project.scripts]
jinjer-sans = "jinjer_sans.build:main"
jinjer-sans-qa = "jinjer_sans.qa:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
