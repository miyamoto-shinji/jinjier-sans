name: build-font

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: jinjer-sans-upstream-${{ hashFiles('sources.lock.json') }}
      - run: sudo apt-get update && sudo apt-get install -y libharfbuzz-bin opentype-sanitizer
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip_audit -r requirements-dev.lock --strict
      - run: python -m pytest
      - run: python -m jinjer_sans.build all --jobs 4
      - run: python -m jinjer_sans.qa --external
      # FontBakery currently requires freetype-py<2.4 while the pinned Gen
      # Interface JP builder requires >=2.4, so keep the validator isolated.
      - run: |
          python -m venv .fontbakery-venv
          .fontbakery-venv/bin/pip install --require-hashes -r requirements-fontbakery.lock
          .fontbakery-venv/bin/fontbakery check-universal --configuration fontbakery.toml --succinct dist/desktop/jinjerSans-VF.ttf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jinjer-sans-${{ github.sha }}
          path: dist/release/
          retention-days: 14
